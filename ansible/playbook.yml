---
- name: Setup Nginx on EC2 (Amazon Linux)
  hosts: web
  become: true

  tasks:
    - name: Update package cache
      dnf:
        update_cache: yes

    - name: Install nginx
      dnf:
        name: nginx
        state: present

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: true
